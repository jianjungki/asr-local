[package]
name = "tauri-llm-v2"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_llm_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-store = "2.4.4"
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
genai = { version = "0.6.5", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
# Sherpa-ONNX and audio processing dependencies
sherpa-onnx = { version = "1.13.3", default-features = false, features = ["shared"] }
rubato = "0.14"
anyhow = "1.0"
hound = "3.5"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
] }
